name: Auto-build dash.html (ha-config branch)

# Rebuild dash.html on every push to the ha-config branch whenever the
# inputs that feed the build change. The committed dash.html is what the
# dashboard serves, so keeping it in sync with src/** avoids drift between
# source and the bundled file.
on:
  push:
    branches: [ha-config]
    paths:
      - "src/**"
      - "tests/**"
      - "VERSION"
      - "build.mjs"
      - "package.json"
      - ".github/workflows/**"

permissions:
  contents: write

jobs:
  build:
    # Pinned: Playwright 1.56 cannot install chromium deps on ubuntu-latest (26.04).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build dash.html
        run: node build.mjs

      # 1. every source script must be valid JavaScript
      - name: Syntax check
        run: |
          for f in $(find src/js -name '*.js' | sort); do node --check "$f"; done

      # 2. boot the built file in a real browser before committing it
      - name: Install test browser
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Smoke test
        run: node tests/smoke.mjs
      - name: Garage alert test
        run: node tests/garage-alert.mjs
      - name: Landscape / full screen test
        run: node tests/landscape.mjs
      - name: Irrigation test
        run: node tests/irrigation.mjs
      - name: View page full screen test
        run: node tests/view-fullscreen.mjs

      - name: Commit dash.html if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Only stage dash.html so node_modules / package-lock changes are
          # never committed back to ha-config by this workflow.
          if git diff --quiet -- dash.html; then
            echo "dash.html unchanged, nothing to commit."
          else
            git add dash.html
            git commit -m "chore: auto-build dash.html [skip ci]"
            git push origin HEAD:ha-config
          fi
