name: Build and release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    # Pinned: Playwright 1.56 cannot install chromium deps on ubuntu-latest (26.04).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 1. dash.html in the repo must be exactly what src/ builds to.
      # On PRs into ha-config, the committed dash.html intentionally lags behind
      # the source so the auto-build workflow can update it; rebuild it locally
      # in that case instead of failing the --check.
      - name: dash.html is up to date
        if: github.base_ref != 'ha-config'
        run: node build.mjs --check
      - name: Rebuild dash.html (PR into ha-config)
        if: github.base_ref == 'ha-config'
        run: node build.mjs

      # 2. every source script must be valid JavaScript
      - name: Syntax check
        run: |
          for f in $(find src/js -name '*.js' | sort); do node --check "$f"; done

      # 3. boot the built file in a real browser
      - name: Install test browser
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Smoke test
        run: node tests/smoke.mjs
      - name: Garage alert test
        run: node tests/garage-alert.mjs
      - name: Landscape / full screen test
        run: node tests/landscape.mjs
      - name: Irrigation test
        run: node tests/irrigation.mjs
      - name: View page full screen test
        run: node tests/view-fullscreen.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: dash.html
          path: dash.html

  release:
    # only when you push a version tag, e.g.  git tag v1.0.1 && git push --tags
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tag must match the VERSION file
        run: |
          test "${GITHUB_REF_NAME}" = "v$(cat VERSION | tr -d '[:space:]')" \
            || { echo "Tag ${GITHUB_REF_NAME} does not match VERSION $(cat VERSION)"; exit 1; }
      - run: node build.mjs --check
      - name: Release notes come from CHANGELOG.md
        run: |
          v="$(tr -d '[:space:]' < VERSION)"
          awk -v v="$v" '/^## /{ if (found) exit; if ($2 == v) { found = 1; next } } found' CHANGELOG.md > release-notes.md
          test -s release-notes.md || { echo "CHANGELOG.md has no '## $v' section"; exit 1; }
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dash.html config.example.js \
            --title "Kinetic ${GITHUB_REF_NAME#v}" --notes-file release-notes.md
